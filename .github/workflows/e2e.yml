name: E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  e2e:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bookshelf
      SECRET_KEY: ci-e2e-secret
      API_URL: http://localhost:8000
      VITE_API_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --all-extras

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Install Playwright
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Postgres
        run: docker compose up -d postgres

      - name: Wait for Postgres
        run: |
          timeout 60 bash -c \
            'until docker compose exec -T postgres pg_isready -U postgres; do sleep 1; done'

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Start API
        run: uv run uvicorn app.main:app --port 8000 &

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Start frontend (preview)
        run: cd frontend && npx vite preview --port 5173 &

      - name: Wait for servers
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'
          timeout 30 bash -c 'until curl -sf http://localhost:5173; do sleep 1; done'

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
