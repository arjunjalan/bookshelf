<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bookshelf — Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #fafaf9;
        color: #1c1917;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        text-align: center;
      }
      .icon { font-size: 3rem; margin-bottom: 1.25rem; }
      h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
      p { font-size: 0.875rem; color: #78716c; line-height: 1.6; max-width: 22rem; }
      button {
        margin-top: 1.75rem;
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 0.5rem;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { background: #4338ca; }
    </style>
  </head>
  <body>
    <div class="icon">📚</div>
    <h1>You're offline</h1>
    <p>Your shelf will be available again when you reconnect. Any cached pages will still load.</p>
    <button onclick="window.location.reload()">Try again</button>
  </body>
</html>
